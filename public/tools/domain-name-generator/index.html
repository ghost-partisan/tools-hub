<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generate brandable domain name ideas from keywords."><title>Domain Name Generator — Tools Hub</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">Tools Hub</a></div></header><main class="container"><section class="hero"><p class="eyebrow">DOMAINS</p><h1>Domain Name Generator</h1><p>Generate short, brandable domain ideas from keywords.</p></section><section class="card"><label for="keyword">Keyword</label><input id="keyword" style="display:block;width:100%;padding:12px;margin:8px 0 14px;border:1px solid #d1d5db;border-radius:8px"><button class="button" onclick="generate()">Generate ideas</button><ul id="results"></ul></section></main><script>function generate(){const k=document.getElementById('keyword').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');const ideas=k?[k+'hub',k+'lab',getPrefix()+k,k+'flow',k+'tools',k+'base']:[];document.getElementById('results').innerHTML=ideas.map(x=>'<li>'+x+'.com</li>').join('')}function getPrefix(){return ['get','try','use'][Math.floor(Math.random()*3)]}</script></body></html>
