<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free email subject line analyzer for length, wording and basic deliverability checks."><title>Email Subject Analyzer — Tools Hub</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">Tools Hub</a></div></header><main class="container"><section class="hero"><p class="eyebrow">EMAIL</p><h1>Email Subject Analyzer</h1><p>Review subject-line length and common wording patterns. This is a heuristic, not a guaranteed spam or inbox-placement score.</p></section><section class="card"><label for="subject">Subject line</label><input id="subject" oninput="analyze()" style="display:block;width:100%;padding:12px;margin:8px 0 14px;border:1px solid #d1d5db;border-radius:8px"><div id="output">Enter a subject line.</div></section></main><script>function analyze(){const s=document.getElementById('subject').value.trim();const n=s.length;const long=n>60?'Long':'Within a common range';const ex=(s.match(/!/g)||[]).length;document.getElementById('output').innerHTML=s?'<p><strong>Characters:</strong> '+n+'</p><p><strong>Length:</strong> '+long+'</p><p><strong>Exclamation marks:</strong> '+ex+'</p>':'Enter a subject line.'}</script></body></html>
